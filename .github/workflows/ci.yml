name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --coverage --coverage-output-format cobertura --results-directory ./coverage
      - name: coverage report
        if: hashFiles('coverage/**/*.cobertura.xml') != ''
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/*.cobertura.xml
          targetdir: coverage/report
          reporttypes: MarkdownSummaryGithub;Cobertura
      - name: coverage summary
        if: hashFiles('coverage/report/SummaryGithub.md') != ''
        run: cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/report
          if-no-files-found: ignore

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
