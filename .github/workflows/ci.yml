name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --coverage --coverage-output-format cobertura --results-directory ./coverage
      - name: coverage report
        if: hashFiles('coverage/**/*.cobertura.xml') != ''
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/*.cobertura.xml
          targetdir: coverage/report
          reporttypes: MarkdownSummaryGithub;Cobertura
      - name: coverage summary
        if: hashFiles('coverage/report/SummaryGithub.md') != ''
        run: cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/report
          if-no-files-found: ignore

  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f samples/McpKit.OpenApiGateway/Dockerfile -t openapi-gateway .
      # listing tools needs no upstream, so this checks the image starts and serves the document
      - name: smoke test
        run: |
          docker run -d --name gateway -p 8080:8080             -v "$PWD/tests/McpKit.Tests/OpenApi/petstore.openapi.json:/config/openapi.json:ro"             -e Upstream__BaseAddress=https://petstore.example/api/v3 openapi-gateway
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf -X POST localhost:8080/mcp -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q '"name":"get_pet_by_id"'
      - if: failure()
        run: docker logs gateway

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the binary scans the whole history, so the first push of a new repo passes too
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1
